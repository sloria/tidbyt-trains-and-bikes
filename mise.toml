[tools]
uv = "latest"
prek = "latest"


[tasks.serve]
description = "Start the indiepixel preview server"
run = "uv run indiepixel --duration 50 src/app/preview.py"
env = { PORT = "8080" }

[tasks.release]
description = "Bump version, commit, tag, and push"
run = "scripts/release.sh {{arg(name='version')}}"

[tasks.lint]
description = "Run linters"
run = "prek run --all-files"
